<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               viewport-fit=cover">

<title>Device Diagnostic</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #030504;
    color: #00ff66;
    font-family: monospace;
}

body {
    min-height: 100dvh;
    padding: 20px;
}

.container {
    max-width: 700px;
    margin: auto;
}

.header {
    border-bottom: 1px solid #00ff66;
    padding-bottom: 15px;
    margin-bottom: 20px;
}

h1 {
    margin: 0;
    font-size: 25px;
}

.subtitle {
    margin-top: 7px;
    opacity: .65;
    font-size: 12px;
}

.status {
    margin-bottom: 20px;
}

.dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    background: #00ff66;
    border-radius: 50%;
    box-shadow: 0 0 12px #00ff66;
}

.progress {
    width: 100%;
    height: 17px;
    border: 1px solid #00ff66;
    margin: 15px 0 6px;
}

.progressBar {
    width: 0%;
    height: 100%;
    background: #00ff66;
    box-shadow: 0 0 15px #00ff66;
}

.percent {
    text-align: right;
    font-size: 12px;
}

.log {
    height: 130px;
    overflow: hidden;
    margin: 20px 0;
    font-size: 12px;
    line-height: 1.5;
}

.results {
    display: none;
}

.card {
    border: 1px solid #00ff66;
    padding: 14px;
    margin: 10px 0;
    background: rgba(0,255,100,.025);
}

.label {
    opacity: .6;
    font-size: 11px;
}

.value {
    margin-top: 5px;
    font-size: 15px;
    word-break: break-word;
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 13px;
    background: #050805;
    border: 1px solid #00ff66;
    color: #00ff66;
    font-family: monospace;
    font-size: 16px;
}

button:active {
    background: #00ff66;
    color: black;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>DEVICE DIAGNOSTIC</h1>

        <div class="subtitle">
            LOCAL DEVICE INFORMATION // NO DATA UPLOAD
        </div>
    </div>

    <div class="status">
        <span class="dot"></span>
        DIAGNOSTIC RUNNING
    </div>

    <div class="log" id="log"></div>

    <div class="progress">
        <div class="progressBar" id="bar"></div>
    </div>

    <div class="percent" id="percent">
        0%
    </div>

    <div class="results" id="results">

        <div class="card">
            <div class="label">USER AGENT</div>
            <div class="value" id="userAgent"></div>
        </div>

        <div class="card">
            <div class="label">BROWSER LANGUAGE</div>
            <div class="value" id="language"></div>
        </div>

        <div class="card">
            <div class="label">SCREEN</div>
            <div class="value" id="screen"></div>
        </div>

        <div class="card">
            <div class="label">VIEWPORT</div>
            <div class="value" id="viewport"></div>
        </div>

        <div class="card">
            <div class="label">TOUCH SUPPORT</div>
            <div class="value" id="touch"></div>
        </div>

        <div class="card">
            <div class="label">ORIENTATION</div>
            <div class="value" id="orientation"></div>
        </div>

        <div class="card">
            <div class="label">NETWORK STATUS</div>
            <div class="value" id="network"></div>
        </div>

        <div class="card" id="batteryCard">
            <div class="label">BATTERY</div>
            <div class="value" id="battery">
                Not available
            </div>
        </div>

        <button onclick="runAgain()">
            RUN DIAGNOSTIC AGAIN
        </button>

    </div>

</div>

<script>

const log = document.getElementById("log");
const bar = document.getElementById("bar");
const percent = document.getElementById("percent");
const results = document.getElementById("results");

const messages = [
    "Initializing diagnostic engine...",
    "Checking browser environment...",
    "Reading display information...",
    "Checking touch interface...",
    "Checking network status...",
    "Checking device capabilities...",
    "Reading available battery information...",
    "Finalizing diagnostic..."
];

let progress = 0;
let messageIndex = 0;

function addLog(text) {

    const line = document.createElement("div");

    line.textContent = "> " + text;

    log.appendChild(line);

    while (log.children.length > 8) {
        log.removeChild(log.firstChild);
    }
}

function runDiagnostic() {

    progress = 0;
    messageIndex = 0;

    log.innerHTML = "";
    results.style.display = "none";

    function step() {

        progress += 2;

        if (progress > 100)
            progress = 100;

        bar.style.width = progress + "%";
        percent.textContent =
            Math.floor(progress) + "%";

        if (
            messageIndex < messages.length &&
            progress >=
            (messageIndex + 1) * 12
        ) {

            addLog(
                messages[messageIndex]
            );

            messageIndex++;
        }

        if (progress < 100) {

            setTimeout(step, 55);

        } else {

            setTimeout(showResults, 500);
        }
    }

    step();
}

function showResults() {

    document.getElementById("userAgent").textContent =
        navigator.userAgent;

    document.getElementById("language").textContent =
        navigator.language || "Unknown";

    document.getElementById("screen").textContent =
        screen.width + " × " +
        screen.height + " px";

    document.getElementById("viewport").textContent =
        window.innerWidth + " × " +
        window.innerHeight + " px";

    document.getElementById("touch").textContent =
        navigator.maxTouchPoints > 0
        ? "YES"
        : "NO";

    document.getElementById("orientation").textContent =
        screen.orientation
        ? screen.orientation.type
        : "Unknown";

    document.getElementById("network").textContent =
        navigator.onLine
        ? "ONLINE"
        : "OFFLINE";

    results.style.display = "block";

    getBattery();
}

async function getBattery() {

    if (!navigator.getBattery) {
        document.getElementById("battery")
            .textContent =
            "Not available in this browser.";
        return;
    }

    try {

        const battery =
            await navigator.getBattery();

        const level =
            Math.round(
                battery.level * 100
            );

        document.getElementById("battery")
            .textContent =
            level + "% " +
            (battery.charging
                ? "(charging)"
                : "(not charging)");

    } catch {

        document.getElementById("battery")
            .textContent =
            "Not available.";
    }
}

function runAgain() {
    runDiagnostic();
}

runDiagnostic();

</script>

</body>
</html>
